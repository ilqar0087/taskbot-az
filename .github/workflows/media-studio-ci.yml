name: AI Media Studio CI
on:
  push:
    branches: [ai-media-studio]
    paths:
      - "media-studio/**"
      - ".github/workflows/media-studio-ci.yml"
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r media-studio/requirements.txt
      - run: python -m py_compile media-studio/main.py
